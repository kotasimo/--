<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>院試チャット保存</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>院試チャット保存</h1>
        <span id="status">待機中</span>
      </header>

      <section>
        <label>
          Supabase URL
          <input id="supabaseUrl" placeholder="https://xxxx.supabase.co" />
        </label>
        <label>
          Publishable key
          <input id="supabaseKey" type="password" placeholder="eyJ..." />
        </label>
      </section>

      <section>
        <label>
          科目
          <select id="subject">
            <option value="thermo">熱力</option>
            <option value="vibration">振動</option>
            <option value="material">材力</option>
            <option value="fluid">流体</option>
            <option value="calculus">微積</option>
            <option value="linear">線形</option>
            <option value="ode">常微分</option>
            <option value="vector">ベクトル解析</option>
          </select>
        </label>
        <label>
          年度
          <input id="year" inputmode="numeric" value="2024" />
        </label>
        <label>
          タイトル
          <input id="title" value="2024 熱力" />
        </label>
      </section>

      <section class="actions">
        <button id="saveUrlButton" type="button">このURLを保存</button>
        <button id="clearTargetButton" type="button">対象をリセット</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
