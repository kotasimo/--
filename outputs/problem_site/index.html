<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>名大院試 過去問メモ</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="title">
          <h1>過去問メモ</h1>
          <p>年度ごとに問題を見ながら記録</p>
        </div>

        <div class="subject-tabs" aria-label="科目">
          <button class="subject-tab active" data-subject="vibration">振動</button>
          <button class="subject-tab" data-subject="thermo">熱力</button>
          <button class="subject-tab" data-subject="material">材力</button>
          <button class="subject-tab" data-subject="fluid">流体</button>
        </div>

        <div class="year-list" id="yearList" aria-label="年度"></div>
      </aside>

      <section class="workspace">
        <section class="home-view" id="homeView">
          <header class="topbar">
            <div>
              <div class="eyebrow">記録表</div>
              <h2 id="tableTitle">振動 過去問記録</h2>
            </div>
            <div class="status" id="homeSummary">0 / 18</div>
          </header>

          <section class="overview-panel">
            <div class="overview-header">
              <h3>年度別記録</h3>
              <p>表の記録と、問題画面のメモは別々に保存されます。</p>
            </div>
            <div class="overview-scroll">
              <table class="overview-table">
                <thead id="overviewHead"></thead>
                <tbody id="overviewBody"></tbody>
              </table>
            </div>
          </section>
        </section>

        <section class="study-view hidden" id="studyView">
          <header class="topbar">
            <div>
              <div class="eyebrow" id="subjectLabel">振動</div>
              <h2 id="yearTitle">2024年度</h2>
            </div>
            <div class="status" id="saveStatus">保存済み</div>
          </header>

          <section class="memo-panel">
            <label for="memoInput">この年度のメモ</label>
            <textarea
              id="memoInput"
              placeholder="例: 運動方程式の立て方で詰まった。次はモード解析を復習。"
            ></textarea>
          </section>

          <div class="view-switch" aria-label="表示切り替え">
            <button type="button" id="showProblemButton">問題を表示</button>
            <button type="button" id="showAnswerButton">解答を表示</button>
            <label class="zoom-control" for="imageZoom">
              <span>画像サイズ</span>
              <input id="imageZoom" type="range" min="60" max="140" step="5" value="100" />
              <output id="imageZoomValue" for="imageZoom">100%</output>
            </label>
          </div>

          <section class="problem-panel">
            <div class="problem-header">
              <h3>問題画像</h3>
              <a id="openImage" href="#" target="_blank" rel="noreferrer">画像だけ開く</a>
            </div>
            <img id="problemImage" alt="問題画像" />
          </section>

          <section class="solution-panel">
            <div class="solution-header">
              <h3>解答</h3>
              <p>ノートPDFから拾った該当ページ</p>
            </div>
            <div id="solutionContent"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="./solutions.js"></script>
    <script src="./answers.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
